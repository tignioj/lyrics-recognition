[project]
name = "lyrics-recognition"
version = "0.1.0"
description = "Align standard lyrics with audio using faster-whisper"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "fastapi==0.116.1",
    "faster-whisper==1.2.0",
    "nvidia-cublas-cu12==12.9.2.10; sys_platform == 'win32'",
    "python-multipart==0.0.20",
    "requests==2.32.5",
    "uvicorn[standard]==0.35.0",
]

[tool.uv]
package = false
